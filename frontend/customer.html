<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PranavX Labs — Ask a Question</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .customer-page {
      max-width: 560px;
      margin: 0 auto;
      padding: 48px 24px;
    }
    .customer-page h1 {
      font-size: 22px;
      font-weight: 600;
      margin: 0 0 6px;
    }
    .customer-page .subtitle {
      color: var(--text-dim);
      font-size: 14px;
      margin: 0 0 28px;
    }
    .field {
      margin-bottom: 16px;
    }
    .field label {
      display: block;
      font-size: 13px;
      color: var(--text-dim);
      margin-bottom: 6px;
    }
    .field input, .field textarea {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 3px;
      font-family: inherit;
      font-size: 14px;
      resize: vertical;
    }
    .field input:focus, .field textarea:focus {
      outline: 2px solid var(--accent);
      outline-offset: -1px;
      border-color: var(--accent);
    }
    #submit-btn {
      width: 100%;
      padding: 11px;
      background: var(--accent);
      color: #0f1115;
      border: none;
      border-radius: 3px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    #submit-btn:disabled {
      opacity: 0.6;
      cursor: default;
    }
    #result-card {
      margin-top: 24px;
      padding: 18px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      border-left: 3px solid var(--accent);
    }
    #result-card.escalated {
      border-left-color: var(--status-escalated);
    }
    #result-card h2 {
      font-size: 14px;
      margin: 0 0 8px;
      color: var(--text-dim);
    }
    #result-card p {
      margin: 0;
      line-height: 1.6;
    }
    .ticket-ref {
      margin-top: 12px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--text-dim);
    }
    .error-banner {
      margin-top: 16px;
      color: var(--priority-critical);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="customer-page">
    <h1>Ask us anything</h1>
    <p class="subtitle">Questions about pricing, services, or the internship program — we usually answer instantly.</p>

    <form id="query-form">
      <div class="field">
        <label for="name">Your name (optional)</label>
        <input type="text" id="name" maxlength="255">
      </div>
      <div class="field">
        <label for="email">Email (optional, so we can follow up if needed)</label>
        <input type="email" id="email" maxlength="255">
      </div>
      <div class="field">
        <label for="question">Your question</label>
        <textarea id="question" rows="4" maxlength="5000" required></textarea>
      </div>
      <button type="submit" id="submit-btn">Send</button>
    </form>

    <div id="result-card" class="hidden">
      <h2 id="result-heading"></h2>
      <p id="result-text"></p>
      <div class="ticket-ref" id="ticket-ref"></div>
    </div>

    <p id="error-banner" class="error-banner hidden"></p>
  </div>

  <script src="customer.js"></script>
</body>
</html>
